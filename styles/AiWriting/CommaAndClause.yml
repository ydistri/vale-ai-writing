extends: sequence
message: "', and' joins two clauses. End the sentence at the comma, or drop the comma."
level: warning
# ", and" followed by a subject and a verb within three tokens. Measured on Go
# comments: 0.78 hits per 1000 words in a standard library sample, 7.8 in orc.
# A list's last item followed by a verb also matches ("a slug, and an id, and
# prints the node").
tokens:
  - pattern: ','
  - pattern: and
  - tag: DT|PRP|PRP\$|EX|NN|NNS|NNP|NNPS|JJ
  - tag: VBZ|VBD|VBP|MD
    skip: 3
